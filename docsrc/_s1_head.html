<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@600&display=swap">
<style>
  :root{
    --ground:#FAFAF8; --surface:#F2F2EF; --surface-2:#EAEAE6;
    --rule:#DEDED8; --rule-strong:#C4C4BC;
    --ink:#1B1C21; --ink-2:#545861; --ink-3:#888C95;
    --accent:#33477A; --ochre:#8A6420; --flag:#8C3A32; --good:#2E6350;
    --shadow:0 1px 2px rgba(20,20,30,.05);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#14151A; --surface:#1C1E24; --surface-2:#23252C;
      --rule:#2E313A; --rule-strong:#41454F;
      --ink:#E8E9EC; --ink-2:#A3A8B2; --ink-3:#767B86;
      --accent:#9BB0E6; --ochre:#D6A855; --flag:#E08A80; --good:#7FC4A8;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ground:#14151A; --surface:#1C1E24; --surface-2:#23252C;
    --rule:#2E313A; --rule-strong:#41454F;
    --ink:#E8E9EC; --ink-2:#A3A8B2; --ink-3:#767B86;
    --accent:#9BB0E6; --ochre:#D6A855; --flag:#E08A80; --good:#7FC4A8;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif; font-size:17px; line-height:1.62;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:820px; margin:0 auto; padding:64px 26px 96px}
  .col{max-width:68ch}
  p{margin:0 0 17px}
  em{font-style:italic}
  a{color:var(--accent)}

  .eyebrow{font-family:"IBM Plex Sans",sans-serif; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-3); font-weight:600; margin:0 0 18px}
  h1{font-size:35px; line-height:1.2; font-weight:600; margin:0 0 14px;
    letter-spacing:-.012em; text-wrap:balance; max-width:20ch}
  .sub{font-size:19px; color:var(--ink-2); margin:0 0 30px; line-height:1.45; max-width:52ch}
  .byline{font-family:"IBM Plex Sans",sans-serif; font-size:14px; color:var(--ink-2);
    border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
    padding:15px 0; margin:0 0 34px; line-height:1.7}
  .byline strong{color:var(--ink); font-weight:600}

  h2.sec{font-size:14px; font-family:"IBM Plex Sans",sans-serif; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
    margin:52px 0 6px; display:flex; gap:14px; align-items:baseline}
  h2.sec .n{color:var(--accent); font-variant-numeric:tabular-nums}
  h2.sec .t{color:var(--ink); letter-spacing:.02em; text-transform:none;
    font-size:22px; font-family:"Source Serif 4",Georgia,serif; font-weight:600}
  h3{font-size:18px; font-weight:600; margin:32px 0 6px; color:var(--ink); text-wrap:balance}

  .han{font-family:"Noto Serif SC",serif; font-weight:600}
  .ipa{font-family:"IBM Plex Mono",monospace; font-size:.9em; color:var(--accent)}
  code{font-family:"IBM Plex Mono",monospace; font-size:.87em; color:var(--ochre)}
  sup.n{font-family:"IBM Plex Sans",sans-serif; font-size:10.5px; font-weight:600;
    color:var(--accent)}
  sup.n a{text-decoration:none}

  .abstract{background:var(--surface); border:1px solid var(--rule); border-radius:2px;
    padding:26px 28px; margin:0 0 12px}
  .abstract h3{margin:0 0 10px; font-size:12px; font-family:"IBM Plex Sans",sans-serif;
    letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
  .abstract p{font-size:16px; margin-bottom:13px}
  .abstract p:last-child{margin-bottom:0}
  .kw{font-family:"IBM Plex Sans",sans-serif; font-size:13px; color:var(--ink-3);
    margin:12px 0 0}

  .box{background:var(--surface); border:1px solid var(--rule); border-radius:2px;
    padding:20px 22px; margin:22px 0}
  .box p:last-child{margin-bottom:0}
  .box.flag{border-left:3px solid var(--flag)}
  .box.key{border-left:3px solid var(--accent)}
  .box.warn{border-left:3px solid var(--ochre)}

  .tablewrap{overflow-x:auto; margin:24px 0 8px; border:1px solid var(--rule);
    border-radius:2px; background:var(--surface); box-shadow:var(--shadow)}
  table{border-collapse:collapse; width:100%; min-width:540px;
    font-family:"IBM Plex Sans",sans-serif; font-size:14px}
  thead th{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-3); font-weight:600; text-align:left; padding:12px 14px 8px;
    border-bottom:1px solid var(--rule-strong); background:var(--surface-2);
    vertical-align:bottom; line-height:1.35}
  tbody td{padding:10px 14px; border-bottom:1px solid var(--rule); vertical-align:baseline}
  tbody tr:last-child td{border-bottom:none}
  td.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
    white-space:nowrap; font-size:13px}
  td.han2{font-family:"Noto Serif SC",serif; font-weight:600; font-size:15px; white-space:nowrap}
  td.han2 .py{display:block; font-family:"IBM Plex Sans",sans-serif; font-weight:400;
    font-size:11px; color:var(--ink-3); margin-top:2px}
  .g{color:var(--good); font-weight:600}
  .b{color:var(--flag); font-weight:600}
  .cap{font-family:"IBM Plex Sans",sans-serif; font-size:13px; color:var(--ink-3);
    margin:0 0 28px; max-width:70ch; line-height:1.55}
  .tnum{font-weight:600; color:var(--accent); letter-spacing:.06em;
    text-transform:uppercase; font-size:11px; margin-right:8px}

  ul,ol{padding-left:22px; max-width:66ch} li{margin-bottom:8px}
  ol.refs{font-family:"IBM Plex Sans",sans-serif; font-size:13.5px; line-height:1.55;
    max-width:72ch} ol.refs li{margin-bottom:9px; scroll-margin-top:20px}
  ol.refs li:target{background:var(--surface-2); box-shadow:0 0 0 5px var(--surface-2)}
  pre.tree{font-family:"IBM Plex Mono",monospace; font-size:12px; line-height:1.65;
    background:var(--surface); border:1px solid var(--rule); border-radius:2px;
    padding:18px 20px; overflow-x:auto; color:var(--ink-2); margin:18px 0}
  hr{border:none; border-top:1px solid var(--rule); margin:52px 0}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>
<style>
  tr.rem td{font-size:14.5px; color:var(--ink-2); line-height:1.55;
    border-top:none; padding:2px 12px 14px; background:transparent}
  td.prop{font-weight:600; color:var(--accent); white-space:nowrap}
  .py{display:block; font-family:"IBM Plex Sans",sans-serif; font-size:11px;
    color:var(--ink-3); font-weight:400; letter-spacing:.02em}
  .lab{display:inline-block; font-family:"IBM Plex Sans",sans-serif; font-size:9.5px;
    letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--accent);
    margin-right:8px; vertical-align:1px}
  tr.rem i{font-style:italic; color:var(--ink)}
  .stamp{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3)}
</style>
